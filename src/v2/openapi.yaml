openapi: 3.0.3
info:
   title: Asset Rack API
   description: API for managing racks and assets.
   version: 2.0.0
servers:
   - url: "http://localhost:3000/api/v2"
     description: Local development server for v2
security:
   - bearerAuth: []
tags:
   - name: Assets
     description: Operations for managing assets.
   - name: Groups
     description: Operations for managing groups.
   - name: Tags
     description: Operations for managing tags.
   - name: Templates
     description: Operations for managing templates.
   - name: Users
     description: Operations for managing users and authentication.
   - name: Roles
     description: Operations for managing roles and role permissions.
   - name: Permissions
     description: Read-only list of available permissions.

paths:
   /assets:
      get:
         tags: [Assets]
         operationId: listAssets
         summary: List all assets.
         parameters:
            - $ref: "#/components/parameters/Page"
            - $ref: "#/components/parameters/Limit"
         responses:
            "200":
               description: List of assets.
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetsPage"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{assetId}:
      get:
         tags: [Assets]
         operationId: getAsset
         summary: Get an asset.
         parameters:
            - $ref: "#/components/parameters/AssetId"
         responses:
            "200":
               description: Asset details.
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetBase"
            "404":
               description: Asset not found.
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"

      patch:
         tags: [Assets]
         operationId: updateAsset
         summary: Update an asset.
         parameters:
            - $ref: "#/components/parameters/AssetId"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: "#/components/schemas/AssetUpdate"
         responses:
            "200":
               description: Asset updated.
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetBase"
            "404":
               description: Asset not found.
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"

      delete:
         tags: [Assets]
         operationId: deleteAsset
         summary: Delete an asset.
         parameters:
            - $ref: "#/components/parameters/AssetId"
         responses:
            "204":
               description: Asset deleted.
            "404":
               description: Asset not found.
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{assetId}/paths:
      get:
         tags: [Assets]
         operationId: listPaths
         summary: List paths of an asset
         parameters:
            - $ref: "#/components/parameters/AssetId"
            - $ref: "#/components/parameters/Page"
            - $ref: "#/components/parameters/Limit"
         responses:
            "200":
               description: List of paths
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetPathsPage"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags: [Assets]
         operationId: createAssetPaths
         summary: Add one or more paths to an asset
         parameters:
            - $ref: "#/components/parameters/AssetId"
            - $ref: "#/components/parameters/Page"
            - $ref: "#/components/parameters/Limit"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: array
                     items:
                        $ref: "#/components/schemas/AssetPathCreate"
         responses:
            "201":
               description: Paths added
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetPathsPage"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{assetId}/paths/{pathId}:
      patch:
         tags: [Assets]
         operationId: updateAssetPath
         summary: Update a single asset path's name or path value
         parameters:
            - $ref: "#/components/parameters/AssetId"
            - name: pathId
              in: path
              required: true
              description: Asset path identifier
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     properties:
                        path:
                           type: string
                        name:
                           type: string
         responses:
            "200":
               description: Updated path
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetPath"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{assetId}/history:
      get:
         tags: [Assets]
         operationId: listAssetHistory
         summary: List history entries for an asset
         parameters:
            - $ref: "#/components/parameters/AssetId"
            - $ref: "#/components/parameters/Page"
            - $ref: "#/components/parameters/Limit"
         responses:
            "200":
               description: List of history entries
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetHistoryPage"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags: [Assets]
         operationId: createAssetHistory
         summary: Add a new history entry to an asset
         parameters:
            - $ref: "#/components/parameters/AssetId"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - json
                     properties:
                        json:
                           type: string
         responses:
            "201":
               description: History entry created
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetHistoryEntry"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{assetId}/history/{historyId}:
      delete:
         tags: [Assets]
         operationId: deleteAssetHistory
         summary: Delete a history entry for an asset
         parameters:
            - $ref: "#/components/parameters/AssetId"
            - $ref: "#/components/parameters/HistoryId"
         responses:
            "204":
               description: History entry deleted.
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
   /assets/{assetId}/tags/add:
      post:
         tags: [Assets]
         operationId: addTagsToAsset
         summary: Add tags to an asset
         parameters:
            - name: id
              in: path
              required: true
              description: Asset identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - tags
                     properties:
                        tags:
                           type: array
                           items:
                              type: integer
         responses:
            "200":
               description: Asset updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetBase"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{assetId}/tags/remove:
      post:
         tags: [Assets]
         operationId: removeTagsFromAsset
         summary: Remove tags from an asset
         parameters:
            - name: id
              in: path
              required: true
              description: Asset identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - tags
                     properties:
                        tags:
                           type: array
                           items:
                              type: integer
         responses:
            "200":
               description: Asset updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetBase"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/servers:
      get:
         tags: [Assets]
         operationId: listServers
         summary: List all servers.
         parameters:
            - $ref: "#/components/parameters/Page"
            - $ref: "#/components/parameters/Limit"
         responses:
            "200":
