                - $ref: "#/components/schemas/AssetUpdate"
                - $ref: "#/components/schemas/UpsUpdate"
      responses:
        "200":
          description: UPS updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsAsset"
        "400":
