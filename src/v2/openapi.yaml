        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Assets
      operationId: createGenericAsset
      summary: Create a generic asset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Generic asset created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/assets/generic/{id}":
    get:
      tags:
        - Assets
      operationId: getGenericAsset
      summary: Get a generic asset by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
