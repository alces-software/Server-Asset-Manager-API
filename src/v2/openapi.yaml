components:
   securitySchemes:
      bearerAuth:
         type: http
         scheme: bearer
         bearerFormat: JWT
         description: Enter your JWT token in the format 'Bearer <token>'.

   parameters:
      AssetId:
         name: assetId
         in: path
         required: true
         schema:
            type: string

      GroupId:
         name: groupId
         in: path
         required: true
         schema:
            type: string

      TagId:
         name: tagId
         in: path
         required: true
         schema:
            type: string

      ServerId:
         name: serverId
         in: path
         required: true
         schema:
            type: string

      UpsId:
         name: upsId
         in: path
         required: true
         schema:
            type: string

      PduId:
         name: pduId
         in: path
         required: true
         schema:
            type: string

      StorageId:
         name: storageId
         in: path
         required: true
         schema:
            type: string
      HistoryId:
         name: historyId
         in: path
         required: true
         description: History entry identifier.
         schema:
            type: integer
            format: int32
      ID:
         name: id
         in: path
         required: true
         description: Resource identifier.
         schema:
            type: integer
            format: int32

      Query:
         name: query
         in: query
         description: A sting to be searched.
         schema:
            type: string
      Page:
         name: page
         in: query
         description: Page index
         schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
      Limit:
         name: limit
         in: query
         description: Number of items per page
         schema:
            type: integer
            format: int32
            minimum: 1
            default: 25

   schemas:
      User:
         type: object
         description: The user response
         required:
            - id
         properties:
            id:
               type: integer
               format: int32

      Template:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            paths:
               type: array
               items:
                  $ref: "#/components/schemas/TemplatePath"

      TemplatePathInput:
         type: object
         required:
            - path
            - name
         properties:
            path:
               type: string
            name:
               type: string

      TemplatePath:
         type: object
         required:
            - id
            - path
            - name
         properties:
            id:
               type: integer
               format: int32
            path:
               type: string
            name:
               type: string

      Permission:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string

      Role:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            permissions:
               type: array
               items:
                  $ref: "#/components/schemas/Permission"

      Tag:
         type: object
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string

      AssetGroup:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string

      AssetStorageReference:
         type: object
         required:
            - id
         properties:
            id:
               type: integer
               format: int32

      AssetPath:
         type: object
         required:
            - id
            - path
            - name
            - value
         properties:
            id:
               type: integer
               format: int32
            path:
               type: string
            name:
               type: string
            value:
               type: string

      AssetPathCreate:
         type: object
         required:
            - path
            - name
         properties:
            path:
               type: string
            name:
               type: string

      AssetJson:
         type: object
         required:
            - id
            - rawJson
            - position
            - total
         properties:
            id:
               type: integer
               format: int32
            rawJson:
               type: string
            position:
               type: integer
               format: int32
            total:
               type: integer
               format: int32

      AssetHistoryEntry:
         type: object
         required:
            - id
            - rawJson
         properties:
            id:
               type: integer
               format: int32
            rawJson:
               type: string

      AssetsPage:
         type: object
         properties:
            page:
               type: integer
               format: int32
            limit:
               type: integer
               format: int32
            total:
               type: integer
               format: int32
            totalPages:
               type: integer
               format: int32
            assets:
               type: array
               items:
                  $ref: "#/components/schemas/AssetBase"

      ServersPage:
         type: object
         properties:
            page:
               type: integer
               format: int32
            limit:
               type: integer
               format: int32
            total:
               type: integer
               format: int32
            totalPages:
               type: integer
               format: int32
            servers:
               type: array
               items:
                  $ref: "#/components/schemas/ServerAsset"

      UpsPage:
         type: object
         properties:
            page:
               type: integer
               format: int32
            limit:
               type: integer
               format: int32
            total:
               type: integer
               format: int32
            totalPages:
               type: integer
               format: int32
            ups:
               type: array
               items:
                  $ref: "#/components/schemas/UpsAsset"

      PdusPage:
         type: object
         properties:
            page:
               type: integer
               format: int32
            limit:
               type: integer
               format: int32
            total:
               type: integer
               format: int32
            totalPages:
               type: integer
               format: int32
            pdus:
               type: array
               items:
                  $ref: "#/components/schemas/PduAsset"

      StoragePage:
