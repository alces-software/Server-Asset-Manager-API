      operationId: updateStorage
      summary: Update a storage device.
      parameters:
        - $ref: "#/components/parameters/StorageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AssetUpdate"
                - $ref: "#/components/schemas/StorageUpdate"
      responses:
        "200":
          description: Storage device updated.
          content:
