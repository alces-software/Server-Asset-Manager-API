      summary: Update a server.
      parameters:
        - $ref: "#/components/parameters/ServerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AssetUpdate"
                - $ref: "#/components/schemas/ServerUpdate"
      responses:
        "200":
          description: Server updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /assets/ups:
    get:
      tags:
        - Assets
      operationId: listUps
      summary: List all UPS units.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of UPS units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsPage"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Assets
      operationId: createUps
      summary: Create a UPS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AssetCreate"
                - $ref: "#/components/schemas/UpsCreate"
      responses:
        "201":
          description: UPS created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/assets/ups/{upsId}":
    get:
      tags:
        - Assets
      operationId: getUps
      summary: Get a UPS.
