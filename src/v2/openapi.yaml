            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

      patch:
         tags: [Assets]
         operationId: updateUps
         summary: Update a UPS.
         parameters:
            - $ref: "#/components/parameters/UpsId"
         requestBody:
            required: true
