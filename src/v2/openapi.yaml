  /api/v2/logs:
    get:
      tags:
        - Logs
      summary: Get API request logs
      description: Returns a paginated list of API request logs with optional filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of logs to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: userId
          in: query
          description: Filter logs by user ID.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: endpoint
          in: query
          description: Filter logs by endpoint.
          required: false
          schema:
            type: string
            example: /api/v2/users/login
        - name: method
          in: query
          description: Filter logs by HTTP method.
          required: false
          schema:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
              - HEAD
        - name: code
          in: query
          description: Filter logs by HTTP status code.
          required: false
          schema:
            type: integer
            minimum: 100
            maximum: 599
            example: 200
        - name: from
          in: query
          description: Return logs from this timestamp onwards.
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-08-01T00:00:00Z"
        - name: to
          in: query
          description: Return logs up to this timestamp.
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-08-10T23:59:59Z"
        - name: minDurationMs
          in: query
          description: Filter logs with a duration greater than or equal to this value.
          required: false
          schema:
            type: integer
            minimum: 0
            example: 500
        - name: maxDurationMs
          in: query
          description: Filter logs with a duration less than or equal to this value.
          required: false
          schema:
            type: integer
            minimum: 0
            example: 2000
      responses:
        "200":
          description: Paginated list of API request logs.
          content:
            application/json:
              schema:
                type: object
                required:
                  - logs
                  - page
                  - limit
                  - total
                  - totalPages
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - timestamp
                        - endpoint
                        - method
                        - durationMs
                        - code
                        - requestSizeBytes
                        - responseSizeBytes
                      properties:
                        id:
                          type: integer
                          example: 123
                        timestamp:
                          type: string
                          format: date-time
                          example: "2026-08-10T09:15:23Z"
                        endpoint:
                          type: string
                          example: /api/v2/users/login
                        method:
                          type: string
                          example: POST
                        durationMs:
                          type: integer
                          nullable: true
                          example: 106
                        code:
                          type: string
                          nullable: true
                          example: "200"
                        requestSizeBytes:
                          type: integer
                          nullable: true
                          example: 43
                        responseSizeBytes:
                          type: integer
                          nullable: true
                          example: 327
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 25
                  total:
                    type: integer
                    example: 1432
                  totalPages:
                    type: integer
                    example: 58
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
